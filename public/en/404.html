<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Kernesys</title>
  <meta name="description" content="The page you are looking for does not exist." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#074d7e" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/XRXV3I6Li01BKofINeaB.woff2" crossorigin />
  <link rel="stylesheet" href="/css/fonts-nunito.css" />
  <style>
    :root { --brand:#074d7e; --brand-2:#0a6bab; --text:#334155; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Nunito', system-ui, sans-serif; color:var(--text); background:var(--bg); line-height:1.7; }
    a { color:var(--brand); }
    .site-header { background:var(--brand); padding:14px 16px; }
    .site-header .inner, main, .site-footer .inner { max-width:860px; margin:0 auto; }
    .site-header img { display:block; height:44px; width:auto; }
    main { padding:40px 16px 56px; }
    .doc { background:#fff; border:1px solid var(--line); border-radius:16px; padding:32px clamp(18px, 4vw, 44px); }
    h1 { color:#1a202c; font-size:clamp(1.6rem, 4vw, 2.2rem); line-height:1.2; margin:0 0 8px; }
    h2 { color:var(--brand); font-size:1.15rem; margin:28px 0 6px; }
    .updated { color:var(--muted); font-size:.9rem; margin:0 0 20px; }
    .back { display:inline-block; margin-top:28px; font-weight:700; text-decoration:none; }
    .back:hover { text-decoration:underline; }
    .site-footer { border-top:1px solid var(--line); padding:20px 16px; font-size:.9rem; color:var(--muted); }
    .site-footer a { margin-right:12px; }
    .site-header .inner { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .lang-switch { display:flex; align-items:center; gap:6px; }
    .lang-link { display:inline-flex; padding:3px; border:2px solid transparent; border-radius:6px; opacity:.6; line-height:0; transition:opacity .2s ease, border-color .2s ease; }
    .lang-link img { display:block; width:24px; height:16px; border-radius:3px; }
    .lang-link:hover, .lang-link:focus-visible { opacity:1; }
    .lang-link.is-active { opacity:1; border-color:rgba(255,255,255,.85); }
    .lang-link:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="inner">
      <a href="/en/" aria-label="Kernesys - Home">
        <picture><source type="image/webp" srcset="/img/logokernesys.webp" /><img src="/img/logokernesys.png" alt="Kernesys" width="400" height="104" /></picture>
      </a>
      <div class="lang-switch" role="group" aria-label="Language">
        <a class="lang-link" href="/" hreflang="es" lang="es" title="Ver en español"><img src="/img/flags/mx.svg" alt="Español" width="24" height="16" /></a>
        <a class="lang-link is-active" href="/en/" hreflang="en" lang="en" title="English"><img src="/img/flags/us.svg" alt="English" width="24" height="16" /></a>
      </div>
    </div>
  </header>

  <main>
    <article class="doc">
      <h1>Page not found</h1>
      <p class="updated">Error 404</p>
      <p>The page you are looking for does not exist or has been moved. You can go back to the home page or email us at
        <a href="mailto:contacto@kernesys.com">contacto@kernesys.com</a>.</p>
      <a class="back" href="/en/">&larr; Back to kernesys.com</a>
    </article>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <a href="/en/terms/">Terms of use</a>
      <a href="/en/privacy/">Privacy Notice</a>
      <span>&copy; Kernesys · Monterrey, Nuevo León, Mexico</span>
    </div>
  </footer>
</body>

</html>
